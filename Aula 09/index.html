<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../Imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="Style.css">
    <title>Aula 09</title>
</head>
<body>
    <h1>Aula 09</h1>
    <hr>
    <h2>Aula De Audio</h2>
    <p>
        Aprendendo a reproduzir audio html5
    </p>
    <audio src="midia/homem-judeu.mp4" controls autoplay></audio>
    <!--controls - usado para colocar o controle de audio, ou seja, o botão para iniciar o audio; autroplay - usado para iniciar o audio; nem todo navegador e compativel com o mp3, para isso pode ser usado KAV ou OGG-->
    <hr>
    <h2>Outra baneira de Adicionar Audio</h2>
    <audio preload="metadata" autoplay controls loop>
        <source src="midia/homem-judeu.mp4" type="audio/mpeg">
        <source src="midia/homem-judeu.ogg" type="audio/ogg">
        <source src="midia/homem-judeu.wav" type="audio/wav">
        <p>
            Infelizmente seu navagador não é compativel com a reprodução de audio <a href="midia/homem-judeu.mp4">clique aqui para baixar</a>
        </p>
    </audio> <!--preload - o jeito que será puxado as informacões entre elas há: auto(só carregará o site após ser baixada toda a informação); metadata(carregará apenas informações como duração e etc); none(não carregará nada) e a o loop, que fará o audio ficar em looping-->

    <p style="text-align: right;">
        <a href="../Meus Estudos HTML/index.html">Minha pagina inicial</a>
      </p>
</body>
</html>
