<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../Imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="Style.css">
    <title>Aula 10</title>
</head>
<body>
    <h1>Vídeos</h1>
    <hr>
    <h2>Videos Internos</h2>
    <p>Este video está localizado no meu próprio servidor</p>
    <video controls>
        <source src="midia/homem-judeu.mp4" type="video/mp4">
        <source src="midia/TRIAL____________Tu és + Águas Purificadoras (Ao Vivo) _ Fhop Music.mp4" type="video/webm">
        <p>Seu computador não tem compatibilidade com os videos</p>
    </video>
    <!--Para hospedar um vídeo em seu próprio servidor, basta colocar 'video'; 
    width= "tamanho"; 
    deve-se usar o source para botar mais opções de video;
    poster para colocar uma capa-->
    <hr>
    <h2>Vídeos Externos</h2>
    <p>Videos do Youtube</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/3wxWb7wPowc?si=2mNKTrwDt-OYpJDi" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <!--Basta pegar o link dado pelo local de hosteamento do vídeo no compartilhar
    YOUTUBE -> Publico
    VIMEO -> Privado/Publico-->
    <p style="text-align: right;">
        <a href="../Meus Estudos HTML/index.html">Minha pagina inicial</a>
      </p>
</body>
</html>
