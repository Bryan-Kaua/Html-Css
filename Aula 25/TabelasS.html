<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Simples</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        body{
            background-color: skyblue;
        }
        h1{
            text-align: center;
            text-decoration: underline;
            font-size: 7vw;
            font-family: cursive;
        }

        table{
            border-collapse: collapse;
            width: 40vw;
            height: 40vw;
            margin: 20px auto;
        }


        td{
            border: 1px black solid;
            font-size: 4vw;
            text-align: center;
            vertical-align: top;
        }


    </style>
</head>
<body>
    <h1>Tabelas Simples</h1>

    <table>

        <tr>

            <td>a1</td>
            <td>b1</td>
            <td>c1</td>

        </tr>

        <tr>

            <td>a2</td>
            <td>b2</td>
            <td>c2</td>

        </tr>

        <tr>

            <td>a3</td>
            <td>b3</td>
            <td>c3</td>

        </tr>


    </table>

</body>
</html>
